<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Engineering Benches">
  <rect x="2" y="2" width="60" height="60" rx="4" fill="#F1E8D4" stroke="#3B3A38" stroke-width="2.5"/>
  <rect x="7" y="7" width="50" height="50" fill="none" stroke="#8A5A2B" stroke-width="1" stroke-dasharray="3 2"/>
  <!-- Set-square -->
  <polygon points="15,49 49,49 15,17" fill="#C9D5DC" fill-opacity="0.55" stroke="#3B3A38" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="21,43 35,43 21,30" fill="#F1E8D4" stroke="#3B3A38" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Drafting compass -->
  <circle cx="38" cy="18" r="3.5" fill="none" stroke="#1F4E79" stroke-width="2.2"/>
  <line x1="38" y1="11" x2="38" y2="14.5" stroke="#1F4E79" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="36.2" y1="21" x2="27" y2="45" stroke="#1F4E79" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="39.8" y1="21" x2="49" y2="45" stroke="#1F4E79" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Red pencil callout dot -->
  <circle cx="49" cy="49" r="2.2" fill="#B5543C"/>
</svg>
